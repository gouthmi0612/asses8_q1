<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Personal Profile Web Application</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f6f9;
            color: #333;
        }
        .profile-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 0 auto;
        }
        h1 { color: #0056b3; border-bottom: 2px solid #0056b3; padding-bottom: 10px; }
        .info { margin: 10px 0; font-size: 1.1em; }
        .label { font-weight: bold; color: #555; }
    </style>
</head>
<body>

<div class="profile-card">
    <h1>Personal Profile</h1>
    <div class="info"><span class="label">Name:</span> [Your Name Here]</div>
    <div class="info"><span class="label">Register Number:</span> [Your Register Number]</div>
    <div class="info"><span class="label">Department:</span> [Your Department]</div>
    <div class="info"><span class="label">Skills:</span> HTML, CSS, Docker, Kubernetes, Git</div>
    <div class="info">
        <span class="label">Career Objective:</span> 
        To work in a challenging engineering environment where I can leverage my DevOps and cloud containerization skills.
    </div>
</div>

</body>
</html>
