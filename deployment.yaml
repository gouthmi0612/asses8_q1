apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-deployment
  labels:
    app: profile-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: profile-web
  template:
    metadata:
      labels:
        app: profile-web
  spec:
    containers:
    - name: profile-app
      image: your-dockerhub-username/profile-app:latest
      ports:
      - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: profile-service
spec:
  type: NodePort
  selector:
    app: profile-web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30010
